# Dev / example only: builds from source. In production write your own compose
# pulling ghcr.io/<owner>/rolando and ghcr.io/<owner>/rolando/web,
# with env vars set inline (see bot/.env.example).
# Scale out: raise NODE_COUNT, add rolando-1..N-1 with their NODE_INDEX and own data dir.
name: rolando

x-node: &node
  build: ./bot
  image: rolando
  env_file: bot/.env
  restart: unless-stopped

x-node-env: &node-env
  DATA_DIR: /data
  SERVER_ADDRESS: 0.0.0.0:8080
  NODE_API_ADDRESS: 0.0.0.0:9000
  NODE_ADDR: http://rolando-%d:9000
  SHARD_COUNT: 16
  NODE_COUNT: 1

services:
  web:
    build: ./web
    image: rolando-web
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      API_URL: http://rolando-0:8080
      INVITE_URL: ${INVITE_URL:-}
      REPO_URL: ${REPO_URL:-}
      COMMUNITY_INVITE_URL: ${COMMUNITY_INVITE_URL:-}
      SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped

  rolando-0:
    <<: *node
    ports:
      - "8080:8080"
    volumes:
      - ./bot/data:/data
    environment:
      <<: *node-env
      NODE_INDEX: 0

  # rolando-1:
